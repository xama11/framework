{% extends "layouts/app.html" %}

{% block content %}

<div x-data="{ tab: 'codigo' }" class="w-full space-y-6">
    <!-- Header with Tabs -->
    <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-1">
        <div class="flex space-x-1">
            <button @click="tab = 'opcoes'"
                :class="tab === 'opcoes' ? 'bg-neutral-800 text-white shadow' : 'text-gray-400 hover:text-gray-200 hover:bg-neutral-800/50'"
                class="flex-1 py-2.5 px-4 rounded-lg text-sm font-medium transition-all duration-200">
                Opções
            </button>
            <button @click="tab = 'codigo'"
                :class="tab === 'codigo' ? 'bg-neutral-800 text-white shadow' : 'text-gray-400 hover:text-gray-200 hover:bg-neutral-800/50'"
                class="flex-1 py-2.5 px-4 rounded-lg text-sm font-medium transition-all duration-200">
                Código
            </button>
        </div>
    </div>

    <!-- Content Area -->
    <div class="min-h-[400px]">
        <!-- Code Tab -->
        <div x-show="tab === 'codigo'" x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
            <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-6">
                <form id="editForm" method="post" action="/migration/{{name}}" class="space-y-4">
                    <textarea name="code" id="code" class="hidden" aria-hidden="true"></textarea>

                    <pre contenteditable="true"
                        class="editable-pre bg-neutral-950 text-gray-300 p-4 rounded-lg border border-neutral-800 focus:outline-none focus:border-indigo-500/50 transition-colors overflow-x-auto"><code class="language-python">{{file}}</code></pre>
                </form>
            </div>
        </div>

        <!-- Options Tab -->
        <div x-show="tab === 'opcoes'" x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
            <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-6 flex flex-col items-center justify-center min-h-[200px] text-center">
                <div class="p-3 bg-neutral-800 rounded-full mb-3">
                    <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>
                <h3 class="text-lg font-medium text-white mb-1">Opções de Migração</h3>
                <p class="text-gray-500 text-sm max-w-sm">Configurações adicionais para esta migração estarão disponíveis em breve.</p>
            </div>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('editForm');
    form.addEventListener('submit', (e) => {
        const codeContent = document.querySelector('pre.editable-pre code').innerText;
        document.getElementById('code').value = codeContent;
    });
</script>

{% endblock %}
