{% extends "layouts/app.html" %}

{% block content %}

<div class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-6 flex flex-col justify-between transition-colors">
            <h3 class="text-sm font-medium text-gray-400">Migrations</h3>
            <div class="flex items-baseline gap-2 mt-4">
                <p class="text-3xl font-bold text-white">{{ migrations | length}}</p>
            </div>
        </div>

        <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-6 flex flex-col justify-between transition-colors">
            <h3 class="text-sm font-medium text-gray-400">Commands (Cogs)</h3>
            <div class="flex items-baseline gap-2 mt-4">
                <p class="text-3xl font-bold text-white">{{commands|length}}</p>
            </div>
        </div>
    </div>

    <section x-data="{ tab: 'terminal', expanded: true }" class="bg-neutral-900 border border-neutral-800 rounded-xl overflow-hidden">
        <div class="p-5 flex items-center justify-between">
            <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                System Logs
            </h2>
        </div>

        <div>
            <div class="flex gap-4 border-b border-neutral-800 px-5 pt-4">
                <button @click="tab = 'terminal'"
                    :class="tab === 'terminal' ? 'border-b-2 border-indigo-500 text-indigo-400' : 'text-gray-400 border-transparent hover:text-gray-300'" 
                    class="pb-3 text-sm font-medium transition-colors">
                    Terminal Output
                </button>
            </div>

            <div x-show="tab === 'terminal'" class="p-0">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-gray-500 uppercase bg-neutral-900/50 border-b border-neutral-800">
                            <tr>
                                <th class="px-6 py-3 font-medium">ID</th>
                                <th class="px-6 py-3 font-medium">Command</th>
                                <th class="px-6 py-3 font-medium">Date</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-neutral-800">
                            {% for terminal in terminals %}
                            <tr class="hover:bg-neutral-800/50 transition-colors">
                                <td class="px-6 py-4 font-mono text-xs text-gray-400">{{terminal[0]}}</td>
                                <td class="px-6 py-4 font-mono text-indigo-300">{{terminal[1]}}</td>
                                <td class="px-6 py-4 text-gray-500">{{terminal[2]}}</td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="3" class="px-6 py-8 text-center text-gray-600 italic">No logs available.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</div>

{% endblock %}
